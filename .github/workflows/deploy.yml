name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --quiet \
            requests pandas numpy matplotlib folium scipy plotly imageio-ffmpeg \
            jupyter ipykernel nbconvert

      - name: Install MyST
        run: npm install -g mystmd@1.13.0

      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=300 \
            sismicidad-colombia.ipynb

      - name: Install fonts (Liberation)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation

      - name: Install Typst
        env:
          TYPST_VERSION: v0.15.0
          TYPST_SHA256: 59b207df01be2dab9f13e80f73d04d7ff8273ffd46b3dd1b9eef5c60f3eeabea
        run: |
          curl -fsSL -o typst.tar.xz "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  typst.tar.xz" | sha256sum -c -
          tar -xJf typst.tar.xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst

      - name: Build PDF (Typst)
        run: myst build --typst
        continue-on-error: true

      - name: Build HTML
        run: myst build --html
        env:
          BASE_URL: /cuadernos-reproducibles-crc003

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_build/html"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
